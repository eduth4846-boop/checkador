<style>
:root{
  --primary:#1E3A75; --primary-2:#2F56B0; --primary-3:#4C7CE0; --primary-soft:#E4EAF9;
  --success:#16A34A; --success-soft:#DCFCE7; --danger:#DC2626; --danger-soft:#FEE2E2;

*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{font-family:'Inter',system-ui,sans-serif; color:var(--text); background:var(--bg); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;}
button,input{font-family:inherit; font-size:15px;}

.wrap{max-width:560px; margin:0 auto; padding:22px 16px 48px;}

.topbrand .mark{width:38px; height:38px; border-radius:10px; background:var(--primary); display:flex; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; color:#fff; font-size:16px;}

.status{width:100%; padding:24px 18px; border-radius:16px; text-align:center; font-size:17px; font-weight:700; transition:background .2s,color .2s; min-height:84px; display:flex; align-items:center; justify-content:center;}
.status.idle{background:var(--primary-soft); color:var(--primary);}
.status.ok{background:var(--success-soft); color:#15803D;}
.status.err{background:var(--danger-soft); color:#B91C1C;}
.status.busy{background:var(--accent-soft); color:var(--accent-deep);}

.card{background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:18px; margin-top:14px;}
.hint{font-size:13px; color:var(--muted); margin:0 0 12px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:500;}
.field input{width:100%; padding:12px; border:1px solid var(--line); border-radius:9px; font-size:18px; letter-spacing:.5px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:13px 16px; border-radius:10px; border:1px solid transparent; font-weight:700; cursor:pointer; width:100%;}
.btn-primary{background:var(--primary-2); color:#fff;}
.btn-primary:hover{background:var(--primary);}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--text);}
.btn:disabled{opacity:.55; cursor:not-allowed;}
.row{display:flex; gap:8px;}
details{margin-top:14px;}

.last h3{font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; color:var(--muted); margin:0 0 8px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;}

<body>
<div class="wrap">
  <div class="topbrand">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   Kiosco de marcación — extraído del panel de administración
   (index.html) para que el trabajador tenga un link propio, sin
   pasar por el selector ni el login del admin. Usa exactamente la
   misma base de datos de Supabase que index.html:
   hkszdgfdnffgsvmxqgwd. Solo lee colaboradores/turnos/huellas y
   solo escribe asistencia (y el registro de huellas de este
   dispositivo) — nunca toca nómina, salarios ni otras tablas.
   ========================================================= */
const SUPABASE_URL = 'https://hkszdgfdnffgsvmxqgwd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3pkZ2ZkbmZmZ3N2bXhxZ3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NjIxNjUsImV4cCI6MjEwNTAzODE2NX0.fNEXV5Y1_FQT-0kpVkjhUtFxoRZQhSMJxZjtSX4MZ1w';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const NFC_PAUSA_MS = 3000;          // pausa del lector después de cada lectura
const MIN_ENTRE_MARCAS_MS = 60000;  // una misma persona no puede marcar dos veces en menos de 60 s
const RECARGA_DATOS_MS = 5*60000;   // refresca colaboradores/turnos cada 5 min

const S = { empleados:[], turnos:[], huellas:[], empresa:'', modo:'nfc', ultimas:[], ocupado:false,
  companyLat:null, companyLng:null, companyGeofenceM:null };
const ultimaMarcaPorEmp = {};
let nfcController = null, nfcPausaHasta = 0, nfcPausaTimer = null, overlayTimer = null;

const $ = s => document.querySelector(s);
function setStatus(tipo, msg){ const el=$('#status'); el.className='status '+tipo; el.textContent=msg; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function horaActual(){ return new Date().toTimeString().slice(0,5); }
function aMin(h){ if(!h) return null; const p=String(h).split(':'); return (Number(p[0])||0)*60+(Number(p[1])||0); }
function fmtHoras(h){ const t=Math.round((h||0)*60); return Math.floor(t/60)+'h '+String(t%60).padStart(2,'0')+'m'; }
function parseJSON(v, def){ if(v==null) return def; if(typeof v!=='string') return v; try{ const x=JSON.parse(v); return typeof x==='string'? parseJSON(x, def) : x; }catch(_e){ return def; } }
function soloDigitos(s){ return String(s||'').replace(/\D/g,''); }

/* ---------- horarios y horas (misma lógica que el panel admin) ---------- */
function horarioDe(e){
  const propio = parseJSON(e.horario_propio, null);
  if(propio) return propio;
  const t = S.turnos.find(x=>x.id===e.turno_id);
  if(!t) return null;
  const h = parseJSON(t.horario, null);
  if(h) return h;
  if(t.hora_inicio && t.hora_fin) return {tipo:'continuo', inicio:String(t.hora_inicio).slice(0,5), fin:String(t.hora_fin).slice(0,5), toleranciaMin:5};
  return null;
}
function bloques(h){
  if(!h) return [];
  if(h.tipo==='segmentado') return (h.bloques||[]).filter(b=>b&&b.inicio&&b.fin);
  return (h.inicio&&h.fin)? [{inicio:h.inicio, fin:h.fin}] : [];
}
function horasProgramadas(h){ return bloques(h).reduce((s,b)=>s+Math.max(0,aMin(b.fin)-aMin(b.inicio))/60,0); }
/* La decisión de "¿llegó tarde?" ahora la toma registrar_marcacion() en la
   base de datos (recibe los bloques del horario ya resueltos acá) — así
   la marcación completa se guarda en un solo viaje de red. */

/* ---------- geocerca (misma lógica que index.html: GPS + Haversine, sin
   ninguna API de pago) ---------- */
function distanciaMetros(lat1, lng1, lat2, lng2){
  const R = 6371000, toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function geocercaActiva(){ return S.companyLat!=null && S.companyLng!=null && Number(S.companyGeofenceM)>0; }
function obtenerUbicacion(timeoutMs){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    const t = setTimeout(()=>resolve(null), timeoutMs||8000);
    navigator.geolocation.getCurrentPosition(
      (pos)=>{ clearTimeout(t); resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, precision:pos.coords.accuracy||0}); },
      ()=>{ clearTimeout(t); resolve(null); },
      {enableHighAccuracy:true, timeout:timeoutMs||8000, maximumAge:30000}
    );
  });
}
/* Si no hay geocerca configurada, o no se pudo obtener el GPS (permiso
   denegado, sin señal), NO bloquea — solo bloquea cuando SÍ se pudo ubicar
   y quedó claramente fuera del radio permitido. */
async function verificarGeocerca(){
  if(!geocercaActiva()) return {ok:true};
  const pos = await obtenerUbicacion(8000);
  if(!pos) return {ok:true, sinUbicacion:true};
  const dist = distanciaMetros(pos.lat, pos.lng, S.companyLat, S.companyLng);
  const radio = Number(S.companyGeofenceM)||150;
  const margen = Math.min(pos.precision||0, 100);
  if(dist > radio + margen){
    return {ok:false, mensaje:`Estás a ${Math.round(dist)} m de la oficina (máximo permitido: ${radio} m). Acércate para poder marcar.`};
  }
  return {ok:true, distancia:Math.round(dist)};
}
function horasTrabajadas(marcas){
  let total=0, abierta=null;
  marcas.slice().sort((a,b)=>aMin(a.hora)-aMin(b.hora)).forEach(m=>{
    if(m.tipo==='Entrada') abierta=m.hora;
    else if(m.tipo==='Salida' && abierta!=null){ let d=aMin(m.hora)-aMin(abierta); if(d<0) d+=1440; total+=d/60; abierta=null; }
  });
  return total;
}

/* ---------- datos ---------- */
async function cargarDatos(){
  try{
    const [emps, tur, hue, par] = await Promise.all([
      sb.from('empleados').select('id,nombre,cedula,estado,turno_id,horario_propio'),
      sb.from('turnos').select('*'),
      sb.from('huellas').select('credential_id,empleado_id'),
      sb.from('parametros').select('company_name,company_lat,company_lng,company_geofence_m').eq('id',1).maybeSingle(),
    ]);
    if(emps.error) throw emps.error;
    S.empleados = (emps.data||[]).filter(e=>e.estado==='Activo');
    if(!tur.error) S.turnos = tur.data||[];
    if(!hue.error) S.huellas = hue.data||[];
    if(!par.error && par.data){
      if(par.data.company_name){
        S.empresa = par.data.company_name;
        $('#brandName').textContent = S.empresa;
        $('#brandMark').textContent = S.empresa.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
      }
      S.companyLat = par.data.company_lat; S.companyLng = par.data.company_lng; S.companyGeofenceM = par.data.company_geofence_m;
    }
    return true;
  } catch(err){
    setStatus('err','No se pudo conectar con la base de datos: '+(err.message||err));
    return false;
  }
}
function buscarPorCedula(ced){
  const d = soloDigitos(ced);
  if(!d) return null;
  return S.empleados.find(e=>soloDigitos(e.cedula)===d) || null;
}

/* Registra la marcación con UNA sola llamada a la base de datos: la
   función registrar_marcacion() (Postgres) decide ella misma si toca
   Entrada o Salida y si la entrada fue tarde, todo en el mismo viaje de
   red — antes se hacía un SELECT para leer el estado actual y luego un
   UPSERT para guardar, y esos dos viajes seguidos eran el origen del
   retraso perceptible (más notorio con mala señal). */
async function marcar(e, metodo){
  if(S.ocupado){ return null; }
  const ahora = Date.now();
  const desde = ahora - (ultimaMarcaPorEmp[e.id]||0);
  if(desde < MIN_ENTRE_MARCAS_MS){
    setStatus('err', `${e.nombre}: tu marcación ya quedó registrada hace ${Math.round(desde/1000)} s.`);
    return null;
  }
  S.ocupado = true;
  if(geocercaActiva()) setStatus('busy', 'Verificando tu ubicación…');
  const geo = await verificarGeocerca();
  if(!geo.ok){ setStatus('err', geo.mensaje); S.ocupado = false; return null; }
  setStatus('busy', `Registrando a ${e.nombre}…`);
  try{
    const fecha = hoyISO(), hora = horaActual();
    const h = horarioDe(e);
    const {data, error} = await sb.rpc('registrar_marcacion', {
      p_empleado_id: e.id, p_fecha: fecha, p_hora: hora, p_metodo: metodo,
      p_bloques: bloques(h), p_tolerancia: (h && h.toleranciaMin!=null) ? h.toleranciaMin : 5,
    });
    if(error) throw error;
    const tipo = data.tipo, marcas = data.marcas||[];

    ultimaMarcaPorEmp[e.id] = ahora;
    const horas = horasTrabajadas(marcas);
    const prog = horasProgramadas(h);
    if(tipo==='Salida'){
      setStatus('ok', `Salida registrada — ${e.nombre} (${hora}) · Hoy trabajaste ${fmtHoras(horas)}${prog? ` de ${fmtHoras(prog)} programadas` : ''}`);
    } else {
      setStatus('ok', `Entrada registrada — ${e.nombre} (${hora})${data.tarde && marcas.filter(m=>m.tipo==='Entrada').length===1? ' · llegada tarde' : ''}${horas? ` · llevas ${fmtHoras(horas)} hoy` : ''}`);
    }
    mostrarOverlay(tipo, e.nombre, hora, tipo==='Salida'? horas : null);
    agregarUltima(e.nombre, tipo, hora);
    return tipo;
  } catch(err){
    setStatus('err', 'No se pudo guardar la marcación: '+(err.message||err)+'. Intenta de nuevo.');
    return null;
  } finally {
    S.ocupado = false;
  }
}

/* ---------- UI ---------- */
function mostrarOverlay(tipo, nombre, hora, horas){
  const o=$('#overlay');
  $('#overlayCard').innerHTML = `
    <div class="overlay-ico ${tipo==='Salida'?'out':''}">${tipo==='Salida'?'👋':'✓'}</div>
    <div class="overlay-title">${tipo} registrada</div>
    <div class="overlay-sub">${esc(nombre)} · ${hora}</div>
    ${horas!=null? `<div class="overlay-hours">Hoy trabajaste ${fmtHoras(horas)}</div>` : ''}`;
  o.classList.add('show');
  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(()=>o.classList.remove('show'), tipo==='Salida'? 3500 : 2200);
}
function agregarUltima(nombre, tipo, hora){
  S.ultimas.unshift({nombre, tipo, hora});
  S.ultimas = S.ultimas.slice(0,6);
  $('#lastCard').hidden = false;
  $('#lastList').innerHTML = S.ultimas.map(u=>`<li><span>${esc(u.nombre)}</span><span><span class="tag ${u.tipo==='Entrada'?'in':'out'}">${u.tipo}</span> ${u.hora}</span></li>`).join('');
}
function reloj(){
  const n=new Date();
  $('#clock').textContent = n.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('#date').textContent = n.toLocaleDateString('es-CO',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
function cambiarModo(m){
  if(nfcController){ nfcController.abort(); nfcController=null; }
  S.modo = m;
  try{ localStorage.setItem('marcacion_modo', m); }catch(_e){}
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.modo===m));
  renderModo();
}
function renderModo(){
  const el = $('#body');
  if(S.modo==='nfc'){
    const ok = 'NDEFReader' in window;
    el.innerHTML = `<div class="card">
      <p class="hint">Acerca tu tarjeta o llavero NFC al lector. Funciona en Chrome para Android (sitio con HTTPS).</p>
      <button id="nfcBtn" class="btn btn-primary" ${ok?'':'disabled'} onclick="iniciarNFC()">📶 Activar lector NFC</button>
      ${ok? '' : '<p class="hint" style="margin-top:8px; color:var(--danger);">Este navegador o dispositivo no soporta NFC. Usa la marcación por cédula.</p>'}
    </div>`;
    setStatus('idle', ok? 'Presiona "Activar lector NFC" para empezar.' : 'NFC no disponible en este equipo.');
    if(ok) autoIniciarNFC();
  } else if(S.modo==='huella'){
    const ok = !!window.PublicKeyCredential;
    el.innerHTML = `<div class="card">
      <p class="hint">Usa el sensor de huella o rostro de este equipo.</p>
      <button class="btn btn-primary" ${ok?'':'disabled'} onclick="marcarHuella()">🖐️ Marcar con huella</button>
      <details><summary>Registrar huella de un colaborador en este equipo</summary>
        <div class="field" style="margin-top:10px;"><label>Cédula</label><input id="cedHuella" inputmode="numeric" autocomplete="off"></div>
        <button class="btn btn-ghost" ${ok?'':'disabled'} onclick="registrarHuella()">Registrar huella</button>
      </details>
    </div>`;
    setStatus('idle', ok? 'Presiona "Marcar con huella".' : 'Este navegador no soporta huella (WebAuthn).');
  } else {
    el.innerHTML = `<div class="card">
      <div class="field"><label for="ced">Número de cédula</label><input id="ced" inputmode="numeric" autocomplete="off" placeholder="Escribe tu cédula" onkeydown="if(event.key==='Enter') marcarCedula();"></div>
      <button class="btn btn-primary" onclick="marcarCedula()">Marcar entrada / salida</button>
    </div>`;
    setStatus('idle','Escribe tu cédula y presiona Enter.');
    setTimeout(()=>{ const i=$('#ced'); if(i) i.focus(); }, 50);
  }
}

/* ---------- Cédula ---------- */
async function marcarCedula(){
  const i = $('#ced'); const ced = (i.value||'').trim();
  if(!ced){ setStatus('err','Escribe un número de cédula.'); return; }
  const e = buscarPorCedula(ced);
  i.value = '';
  if(!e){ setStatus('err','No se encontró un colaborador activo con esa cédula.'); return; }
  await marcar(e, 'Manual');
  i.focus();
}

/* ---------- NFC ---------- */
function nfcPausa(){
  nfcPausaHasta = Date.now()+NFC_PAUSA_MS;
  clearInterval(nfcPausaTimer);
  const tick = ()=>{
    const btn=$('#nfcBtn'); const falta = nfcPausaHasta-Date.now();
    if(falta<=0){ clearInterval(nfcPausaTimer); nfcPausaTimer=null; if(btn) btn.textContent='📶 Escuchando… acerca la tarjeta'; return; }
    if(btn) btn.textContent = `⏳ Espera ${Math.ceil(falta/1000)} s para el siguiente escaneo`;
  };
  tick(); nfcPausaTimer = setInterval(tick, 250);
}
async function autoIniciarNFC(){
  /* Si el permiso de NFC ya fue concedido antes, arranca solo (útil en un
     kiosco fijo); si no, espera a que alguien presione el botón. */
  try{ const p = await navigator.permissions.query({name:'nfc'}); if(p.state==='granted') iniciarNFC(); }catch(_e){}
}
async function iniciarNFC(){
  if(!('NDEFReader' in window)) return;
  if(nfcController){ nfcController.abort(); nfcController=null; }
  const controller = new AbortController(); nfcController = controller;
  const btn = $('#nfcBtn');
  try{
    const reader = new NDEFReader();
    await reader.scan({signal: controller.signal});
    if(btn){ btn.disabled=true; btn.textContent='📶 Escuchando… acerca la tarjeta'; }
    setStatus('idle','Acerca tu tarjeta al lector…');
    reader.onreading = async (event)=>{
      if(nfcController!==controller) return;    // lector de una sesión anterior
      if(Date.now() < nfcPausaHasta) return;    // doble lectura del mismo toque
      nfcPausa();
      let ced = '';
      for(const r of event.message.records){ if(r.recordType==='text'){ ced = new TextDecoder(r.encoding||'utf-8').decode(r.data); break; } }
      if(!ced) ced = event.serialNumber||'';
      const e = buscarPorCedula(ced);
      if(!e){ setStatus('err','Tarjeta no reconocida. Pide a RRHH que la asigne a tu cédula.'); return; }
      await marcar(e, 'NFC');
    };
    reader.onreadingerror = ()=>{ if(Date.now()>=nfcPausaHasta) setStatus('err','No se pudo leer la tarjeta, acércala de nuevo.'); };
  } catch(err){
    if(nfcController===controller) nfcController=null;
    if(btn){ btn.disabled=false; btn.textContent='📶 Activar lector NFC'; }
    if(err.name!=='AbortError') setStatus('err','No se pudo activar el lector NFC: '+err.message);
  }
}

/* ---------- Huella (WebAuthn del propio equipo) ---------- */
function b64u(buf){ let s=''; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function marcarHuella(){
  try{
    const a = await navigator.credentials.get({ publicKey:{ challenge: crypto.getRandomValues(new Uint8Array(32)), userVerification:'required', timeout:60000 } });
    const id = b64u(a.rawId);
    const h = S.huellas.find(x=>x.credential_id===id);
    if(!h){ setStatus('err','Huella no registrada en este equipo.'); return; }
    const e = S.empleados.find(x=>x.id===h.empleado_id);
    if(!e){ setStatus('err','Colaborador no encontrado o inactivo.'); return; }
    await marcar(e, 'Huella');
  } catch(err){ setStatus('err','No se pudo leer la huella: '+err.message); }
}
async function registrarHuella(){
  const e = buscarPorCedula($('#cedHuella').value);
  if(!e){ setStatus('err','No se encontró un colaborador activo con esa cédula.'); return; }
  try{
    const cred = await navigator.credentials.create({ publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp:{ name: S.empresa||'Bitácora RRHH' },
      user:{ id: new TextEncoder().encode(e.id), name:e.cedula, displayName:e.nombre },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'required' },
      timeout:60000 }});
    let public_key=''; try{ if(cred.response.getPublicKey) public_key=b64u(cred.response.getPublicKey()); }catch(_e){}
    const huella = {credential_id:b64u(cred.rawId), empleado_id:e.id, public_key, counter:0};
    const {error} = await sb.from('huellas').upsert(huella, {onConflict:'credential_id'});
    if(error) throw error;
    await sb.from('empleados').update({huella:true}).eq('id', e.id);
    S.huellas.push(huella);
    $('#cedHuella').value='';
    setStatus('ok', `Huella registrada para ${e.nombre}.`);
  } catch(err){ setStatus('err','No se pudo registrar la huella: '+err.message); }
}

/* ---------- arranque ---------- */
function estadoRed(){ const n=$('#net'); n.textContent = navigator.onLine? 'En línea' : 'Sin conexión'; n.classList.toggle('off', !navigator.onLine); }
async function pantallaEncendida(){ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(_e){} }
window.addEventListener('online', estadoRed); window.addEventListener('offline', estadoRed);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pantallaEncendida(); });

(async function init(){
  reloj(); setInterval(reloj, 1000); estadoRed(); pantallaEncendida();
  let modo = new URLSearchParams(location.search).get('modo');
  if(!modo){ try{ modo = localStorage.getItem('marcacion_modo'); }catch(_e){} }
  if(!['nfc','huella','manual'].includes(modo)) modo = ('NDEFReader' in window)? 'nfc' : 'manual';
  const ok = await cargarDatos();
  cambiarModo(modo);
  if(ok && !S.empleados.length) setStatus('err','No hay colaboradores activos registrados.');
  setInterval(cargarDatos, RECARGA_DATOS_MS);
})();
</script>
